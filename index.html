<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo</title>
    <link rel="manifest" href="data:application/json,{}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Echo">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a30;color:#c8d6e5;min-height:100vh;overflow-x:hidden}
        .bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 10% 20%,rgba(0,180,255,.25) 0%,transparent 45%),radial-gradient(ellipse at 80% 30%,rgba(0,220,200,.18) 0%,transparent 40%),radial-gradient(ellipse at 50% 60%,rgba(30,80,160,.25) 0%,transparent 50%),radial-gradient(ellipse at 30% 80%,rgba(0,160,220,.15) 0%,transparent 40%),radial-gradient(ellipse at 70% 75%,rgba(60,40,120,.15) 0%,transparent 45%),radial-gradient(ellipse at 90% 10%,rgba(0,200,180,.12) 0%,transparent 35%)}
        .grid-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,200,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.08) 1px,transparent 1px);background-size:40px 40px}
        .scan-line{position:fixed;top:0;left:0;width:100%;height:1px;background:rgba(0,200,255,.1);z-index:999;animation:scanDown 4s linear infinite;pointer-events:none}
        @keyframes scanDown{0%{top:0}100%{top:100%}}
        .orb{position:fixed;border-radius:50%;z-index:0;pointer-events:none;box-shadow:0 0 40px var(--oc),0 0 80px var(--oc);animation:orbFloat var(--od) infinite ease-in-out}
        @keyframes orbFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(20px,-15px)}50%{transform:translate(-10px,-30px)}75%{transform:translate(-20px,10px)}}
        .dp{position:fixed;width:2px;height:2px;border-radius:50%;z-index:0;pointer-events:none;animation:drift var(--dd) infinite ease-in-out;opacity:.7}
        @keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--dx1),var(--dy1))}50%{transform:translate(var(--dx2),var(--dy2))}75%{transform:translate(var(--dx3),var(--dy3))}}
        .screen{min-height:100vh;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;position:relative;z-index:1}
        .screen.active{display:flex}
        h1{font-size:36px;font-weight:900;margin:12px 0;letter-spacing:8px;background:linear-gradient(180deg,#fff,#7ec8e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{color:#6a9ab5;font-size:12px;letter-spacing:4px;margin-bottom:24px}
        .top-right{position:absolute;top:16px;right:16px;z-index:10}
        .btn{display:block;width:100%;max-width:340px;padding:14px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;text-align:center;letter-spacing:2px;transition:all .3s;margin:6px auto;border:none}
        .btn-primary{background:linear-gradient(135deg,rgba(0,200,255,.25),rgba(0,120,200,.15));border:1px solid rgba(0,200,255,.4);color:#00c8ff;box-shadow:0 0 28px rgba(0,200,255,.15)}
        .btn-primary:hover{box-shadow:0 0 45px rgba(0,200,255,.3);transform:translateY(-2px)}
        .btn-secondary{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);color:#7eaabf}
        .btn-disabled{opacity:.4;pointer-events:none}
        .btn-sm{padding:8px 16px;font-size:12px;width:auto;display:inline-block}
        .panel{background:rgba(10,35,65,.7);border:1px solid rgba(0,200,255,.25);border-radius:14px;padding:16px;margin:8px auto;width:100%;max-width:340px;position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
        .panel::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,.5),transparent)}
        .panel .corner-tr{position:absolute;top:8px;right:8px;width:8px;height:8px;border-top:1px solid rgba(0,200,255,.5);border-right:1px solid rgba(0,200,255,.5)}
        .panel .corner-bl{position:absolute;bottom:8px;left:8px;width:8px;height:8px;border-bottom:1px solid rgba(0,200,255,.5);border-left:1px solid rgba(0,200,255,.5)}
        .panel .bracket{position:absolute;color:rgba(0,200,255,.25);font-size:18px;pointer-events:none;font-family:monospace}
        .panel:hover{border-color:rgba(0,200,255,.5);box-shadow:0 0 25px rgba(0,200,255,.1)}
        .panel-title{font-size:12px;font-weight:700;color:#00c8ff;margin-bottom:12px;letter-spacing:3px;display:flex;align-items:center;gap:8px}
        .panel-title .icon{font-size:16px}
        .panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,200,255,.4),transparent)}
        .stat-row{display:flex;gap:10px;margin:10px 0}
        .stat{flex:1;text-align:center;padding:14px 8px;border-radius:10px;background:rgba(0,200,255,.06);border:1px solid rgba(0,200,255,.15);cursor:pointer;transition:.2s}
        .stat:hover{background:rgba(0,200,255,.12)}
        .stat .num{font-size:30px;font-weight:900}.stat .lbl{font-size:10px;letter-spacing:2px;margin-top:4px}
        .st-alive .num{color:#00e676}.st-alive .lbl{color:#00e676}
        .st-wait .num{color:#ffab00}.st-wait .lbl{color:#ffab00}
        .st-dead .num{color:#ff5252}.st-dead .lbl{color:#ff5252}
        .tag-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .tag{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.2);color:#8cd8f0;letter-spacing:1px;cursor:pointer;transition:.25s}
        .tag:hover{border-color:#00c8ff;box-shadow:0 0 14px rgba(0,200,255,.25)}
        .tag.active{background:rgba(0,200,255,.2);border-color:#00c8ff;color:#fff}
        .tag.gold{border-color:rgba(255,209,0,.35);color:#ffd100}
        .player-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:4px 0;border-radius:8px;background:rgba(0,200,255,.04);border-left:3px solid rgba(0,200,255,.3);transition:.2s;font-size:14px;cursor:pointer}
        .player-row:hover{background:rgba(0,200,255,.1)}
        .player-row .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
        .dot-alive{background:#00e676;box-shadow:0 0 8px #00e676}
        .dot-wait{background:#ffab00;box-shadow:0 0 8px #ffab00;animation:pulse 1s infinite}
        .dot-dead{background:#ff5252}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .player-row.dead{border-left-color:rgba(255,80,80,.4);opacity:.5}
        .hearts{color:#ff6b6b;font-size:13px}
        .info-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;margin:4px;cursor:pointer}
        .chip-blue{background:rgba(0,200,255,.12);border:1px solid rgba(0,200,255,.25);color:#8cd8f0}
        .chip-gold{background:rgba(255,209,0,.1);border:1px solid rgba(255,209,0,.25);color:#ffd100}
        .chip-red{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.25);color:#ff6b6b}
        .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,.2),transparent);margin:10px 0}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:999;justify-content:center;align-items:center}
        .modal.show{display:flex}
        .modal-box{background:rgba(10,35,65,.95);border:1px solid rgba(0,200,255,.4);border-radius:18px;padding:24px;max-width:340px;width:90%;text-align:center}
        .modal-box h3{color:#00c8ff;margin-bottom:8px;letter-spacing:2px}
        .modal-box input{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(0,200,255,.3);background:rgba(0,0,0,.4);color:#fff;font-size:15px;margin:6px 0}
        .win-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:9999;justify-content:center;align-items:center;flex-direction:column;overflow:hidden}
        .win-overlay.show{display:flex}
        .win-overlay .trophy{font-size:80px;animation:bounce 1s infinite;z-index:2}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
        .win-overlay .win-text{color:#00c8ff;font-size:28px;font-weight:900;margin:16px 0;z-index:2;letter-spacing:3px}
        .win-overlay .win-name{color:#fff;font-size:36px;font-weight:900;z-index:2}
        .win-overlay .win-stats{color:#8cd8f0;font-size:14px;margin:8px 0;z-index:2;max-height:30vh;overflow-y:auto}
        .confetti{position:fixed;width:10px;height:10px;z-index:9998;animation:confettiFall 3s forwards}
        @keyframes confettiFall{0%{transform:translateY(-100px)rotate(0);opacity:1}100%{transform:translateY(100vh)rotate(720deg);opacity:0}}
        .revive-bar{background:rgba(225,112,85,.9);color:#fff;padding:8px;border-radius:8px;text-align:center;font-weight:700;font-size:13px;margin:4px auto;max-width:340px}
        .drop-float{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(10,35,65,.9);border:1px solid rgba(0,200,255,.4);border-radius:12px;padding:10px 16px;text-align:center;display:none}
        .drop-float.show{display:block}
        .setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(0,200,255,.04);border-radius:8px;margin:4px auto;font-size:13px;max-width:340px}
        .setting-row select{background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(0,200,255,.3);padding:6px 10px;border-radius:6px;font-size:13px}
        .global-track-bar{background:rgba(0,200,255,.15);color:#00c8ff;padding:4px 10px;border-radius:8px;text-align:center;font-weight:700;font-size:11px;margin:4px auto;display:inline-block}
        .copy-btn{background:rgba(0,200,255,.2);color:#00c8ff;padding:2px 8px;border-radius:6px;font-size:10px;cursor:pointer;margin-left:4px;border:1px solid rgba(0,200,255,.3);font-weight:700}
        .fragment{position:fixed;pointer-events:none;z-index:9998;font-family:monospace;font-weight:700;animation:fragmentBurst .7s forwards}
        @keyframes fragmentBurst{0%{opacity:1;transform:translate(0,0)scale(1)rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))scale(0.3)rotate(var(--rot))}}
        .lobby-settings{width:100%;max-width:340px;margin:0 auto}
        .team-panel{display:flex;gap:10px;width:100%;max-width:340px;margin:10px auto}
        .team-box{flex:1;background:rgba(10,35,65,.7);border-radius:12px;padding:12px;border:1px solid rgba(0,200,255,.25);min-height:80px}
        .team-box.red{border-color:rgba(255,80,80,.4)}.team-box.blue{border-color:rgba(0,150,255,.4)}
        .team-box h3{font-size:14px;margin-bottom:6px}.team-box.red h3{color:#ff6b6b}.team-box.blue h3{color:#00c8ff}
        .team-box .member{display:block;background:rgba(0,0,0,.3);padding:4px 8px;border-radius:6px;margin:2px 0;font-size:12px}
        .team-box .member .kick-btn{float:right;color:#ff5252;cursor:pointer;font-size:10px;margin-left:6px}
        .unassigned{width:100%;max-width:340px;text-align:center;color:#7eaabf;font-size:13px;margin:6px auto}
        .unassigned span{display:inline-block;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:10px;margin:2px;cursor:pointer;font-size:14px}
        input,select{max-width:340px}
    </style>
</head>
<body>
<div class="bg-layer"></div>
<div class="grid-layer"></div>
<div class="scan-line"></div>
<div class="orb" style="width:50px;height:50px;top:20%;left:15%;--oc:rgba(0,200,255,.2);--od:8s"></div>
<div class="orb" style="width:70px;height:70px;top:55%;left:80%;--oc:rgba(255,209,0,.12);--od:10s"></div>
<div class="orb" style="width:40px;height:40px;top:35%;left:50%;--oc:rgba(0,230,118,.12);--od:7s"></div>
<div class="orb" style="width:60px;height:60px;top:75%;left:25%;--oc:rgba(180,100,255,.1);--od:9s"></div>
<div class="orb" style="width:35px;height:35px;top:10%;left:70%;--oc:rgba(0,200,220,.15);--od:6s"></div>
<div id="particlesContainer"></div>

<div class="screen active" id="screenCover">
    <div class="top-right"><span id="userDisplay" style="color:#7eaabf;font-size:12px">未登录</span> <button class="btn btn-sm btn-primary" id="btnLoginTop">登录</button></div>
    <h1>ECHO</h1><p class="subtitle">—— 全息竞技场 ——</p>
    <button class="btn btn-primary btn-disabled" id="btnEnter" disabled onclick="showModal('mainMenuModal')">⚡ 进入战场</button>
    <p style="color:#ff6b6b;font-size:11px;margin-top:8px" id="loginTip">⚠️ 请先登录</p>
</div>

<div class="modal" id="authModal"><div class="modal-box"><h3 id="authTitle">登录</h3><input type="text" id="authUsername" placeholder="用户名"><input type="password" id="authPassword" placeholder="密码"><button class="btn btn-primary" id="btnAuth">登录</button><button class="btn btn-sm btn-secondary" onclick="switchAuthMode()" style="margin-top:4px">没有账号？去注册</button><button class="btn btn-sm btn-secondary" onclick="closeModal('authModal')" style="margin-top:4px">取消</button></div></div>
<div class="modal" id="mainMenuModal"><div class="modal-box"><h3>选择模式</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0">
<div style="background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.3);border-radius:12px;padding:16px;text-align:center;cursor:pointer" onclick="closeModal('mainMenuModal');createRoom('classic')"><div style="font-size:36px">🏆</div><div style="font-weight:800;color:#00c8ff">经典模式</div><div style="font-size:11px;color:#7eaabf">最后存活者获胜</div></div>
<div style="background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.3);border-radius:12px;padding:16px;text-align:center;cursor:pointer" onclick="closeModal('mainMenuModal');createRoom('chess')"><div style="font-size:36px">♟️</div><div style="font-weight:800;color:#00c8ff">象棋模式</div><div style="font-size:11px;color:#7eaabf">身份+等级+阵营</div></div>
</div>
<button class="btn btn-primary" onclick="closeModal('mainMenuModal');showJoinPanel()">🎮 加入房间</button><button class="btn btn-sm btn-secondary" onclick="closeModal('mainMenuModal')">取消</button></div></div>

<div class="screen" id="screenLobby">
    <div class="panel" style="text-align:left;max-width:340px;margin:0 auto 10px"><span class="info-chip chip-blue" id="modeTag">🏆 经典模式</span><p class="room-info" style="margin-top:8px;font-size:13px">房间号：<strong style="color:#00c8ff" id="lobbyRoomDisp">----</strong> <button class="copy-btn" onclick="copyRoomId()">复制</button> <span id="hostTag"></span></p></div>
    <div id="lobbySettings" class="lobby-settings"></div>
    <div id="lobbyPlayerTags" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0"></div>
    <p style="color:#7eaabf;font-size:12px">当前 <span id="lobbyCount">0</span> 人</p>
    <button class="btn btn-primary" id="startBtn" style="display:none" onclick="startGame()">⚡ 开始游戏</button>
    <button class="btn btn-sm btn-secondary" onclick="leaveLobby();showScreen('screenCover')" style="margin-top:6px">🚪 离开房间</button>
</div>

<div class="screen" id="screenGame" style="padding:0;justify-content:flex-start">
    <div style="background:rgba(10,35,65,.9);border-bottom:1px solid rgba(0,200,255,.25);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;width:100%;z-index:100;position:relative"><h3 style="color:#00c8ff;font-size:14px;letter-spacing:2px">ECHO <span id="gameModeTitle">经典模式</span></h3><span style="color:#7eaabf;font-size:12px">🔑 <span id="gameRoomDisp"></span></span></div>
    <div style="width:100%;height:calc(100vh - 90px);position:relative;z-index:1" id="gameMapFull"></div>
    <div style="position:fixed;top:40px;left:0;right:0;z-index:50;padding:4px 8px;pointer-events:none">
        <div style="pointer-events:auto;display:flex;gap:4px;justify-content:center;margin:4px 0">
            <div class="stat-mini" style="border:1px solid #00e676;background:rgba(0,0,0,.75);border-radius:8px;padding:4px 10px;text-align:center;font-size:11px;font-weight:700"><div style="color:#00e676;font-size:16px" id="aliveNum">0</div><div style="color:#aaa;font-size:9px">存活</div></div>
            <div class="stat-mini" style="border:1px solid #ffab00;background:rgba(0,0,0,.75);border-radius:8px;padding:4px 10px;text-align:center;font-size:11px;font-weight:700"><div style="color:#ffab00;font-size:16px" id="waitNum">0</div><div style="color:#aaa;font-size:9px">待确认</div></div>
            <div class="stat-mini" style="border:1px solid #ff5252;background:rgba(0,0,0,.75);border-radius:8px;padding:4px 10px;text-align:center;font-size:11px;font-weight:700"><div style="color:#ff5252;font-size:16px" id="deadNum">0</div><div style="color:#aaa;font-size:9px">淘汰</div></div>
        </div>
        <div style="pointer-events:auto;text-align:center;margin:4px 0"><span class="info-chip chip-blue" id="dropTimerMini">🎁 <span id="dropCountdown">8:00</span></span><span class="info-chip chip-gold" id="globalTrackBar" style="display:none">🌐 全员定位</span></div>
        <div class="revive-bar" id="reviveBar" style="display:none">💀 使用复活卡？<span id="reviveCountdown"></span> <button class="btn btn-sm btn-primary" onclick="useReviveSelf()" style="padding:4px 10px">复活自己</button> <button class="btn btn-sm btn-primary" onclick="showReviveTeammate()" style="padding:4px 10px">复活队友</button> <button class="btn btn-sm btn-secondary" onclick="declineRevive()" style="padding:4px 10px">放弃</button></div>
    </div>
    <div class="drop-float" id="dropCard"><span id="dropIcon" style="font-size:24px"></span> <span id="dropName" style="font-weight:800;color:#00c8ff"></span> <span id="dropDist" style="font-size:11px;color:#4ecdc4"></span> <button class="btn btn-sm btn-primary" onclick="pickupItem()">拾取</button></div>
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:4px;padding:6px">
        <button class="btn btn-sm btn-primary" id="bottomMap" style="flex:1" onclick="togglePanel('map')">🗺️</button>
        <button class="btn btn-sm btn-secondary" id="bottomPlayers" style="flex:1" onclick="togglePanel('players')">👥</button>
        <button class="btn btn-sm btn-secondary" id="bottomBag" style="flex:1" onclick="togglePanel('bag')">🎒</button>
        <button class="btn btn-sm btn-secondary" id="bottomLog" style="flex:1" onclick="togglePanel('log')">📜</button>
    </div>
    <div style="position:fixed;bottom:50px;left:0;right:0;background:rgba(0,0,0,.9);z-index:40;max-height:40vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:12px;display:none" id="panelPlayers"><div id="playerList"></div></div>
    <div style="position:fixed;bottom:50px;left:0;right:0;background:rgba(0,0,0,.9);z-index:40;max-height:40vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:12px;display:none" id="panelBag"><div id="bagArea"></div></div>
    <div style="position:fixed;bottom:50px;left:0;right:0;background:rgba(0,0,0,.9);z-index:40;max-height:40vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:12px;display:none" id="panelLog"><div id="logArea" style="font-size:11px;line-height:1.6;max-height:35vh;overflow-y:auto"></div></div>
</div>

<div class="modal" id="killModal"><div class="modal-box"><h3>⚠️ 确认撕掉</h3><p id="killName" style="font-size:18px;color:#ff6b6b"></p><button class="btn btn-primary" id="btnKill" style="border-color:#ff5252;color:#ff6b6b">✅ 确认撕掉</button><button class="btn btn-sm btn-secondary" onclick="closeModal('killModal')">❌ 取消</button></div></div>
<div class="modal" id="confirmModal"><div class="modal-box"><h3>💀 你被撕了！</h3><p id="confirmKiller" style="font-size:18px;color:#ff6b6b"></p><button class="btn btn-primary" id="btnConfirm" style="border-color:#ffab00;color:#ffab00">😵 确认淘汰</button><button class="btn btn-sm btn-secondary" id="btnDeny">🤚 否认</button></div></div>
<div class="modal" id="useModal"><div class="modal-box"><h3 id="useTitle"></h3><div id="useBody"></div><button class="btn btn-sm btn-secondary" onclick="closeModal('useModal')">取消</button></div></div>
<div class="modal" id="reviveModal"><div class="modal-box"><h3>🔄 选择复活对象</h3><div id="reviveTargets"></div><button class="btn btn-sm btn-secondary" onclick="closeModal('reviveModal')">取消</button></div></div>
<div class="win-overlay" id="winOverlay"><div class="trophy">🏆</div><div class="win-text">战斗结束</div><div class="win-name" id="winName"></div><div class="win-stats" id="winStats"></div><button class="btn btn-primary" onclick="location.reload()" style="z-index:2">🔄 再来一局</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx;
function getAC(){if(!audioCtx)audioCtx=new AudioCtx();return audioCtx}
function playBeep(freq,dur,type='square',vol=.08){try{const ac=getAC();const o=ac.createOscillator();const g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function sfx(name){if(name==='start'){playBeep(600,.1);setTimeout(()=>playBeep(800,.1),100);setTimeout(()=>playBeep(1000,.15),200)}else if(name==='drop'){playBeep(1200,.08);setTimeout(()=>playBeep(1500,.06),80)}else if(name==='pickup'){playBeep(800,.06);setTimeout(()=>playBeep(1000,.06),60);setTimeout(()=>playBeep(1200,.08),120)}else if(name==='kill'){playBeep(300,.15,'sawtooth',.1);setTimeout(()=>playBeep(200,.2,'sawtooth',.08),150)}else if(name==='revive'){playBeep(400,.1);setTimeout(()=>playBeep(600,.1),100);setTimeout(()=>playBeep(800,.12),200)}else if(name==='win'){playBeep(500,.1);setTimeout(()=>playBeep(700,.1),120);setTimeout(()=>playBeep(900,.1),240);setTimeout(()=>playBeep(1100,.2),360)}}

function speakAll(text){speakLocal(text);if(channel)channel.send({type:'broadcast',event:'speak',payload:{text:text}})}
function speakLocal(text){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.2;u.pitch=1.2;speechSynthesis.speak(u)}}

async function handleAuth(){const u=document.getElementById('authUsername').value.trim(),p=document.getElementById('authPassword').value.trim();if(!u||!p)return alert('请输入用户名和密码');if(authMode==='register'){const{data:ex}=await sb.from('users').select('*').eq('username',u).single();if(ex)return alert('用户名已存在');await sb.from('users').insert({username:u,password:p});alert('注册成功！请登录');switchAuthMode()}else{const{data:user}=await sb.from('users').select('*').eq('username',u).eq('password',p).single();if(!user)return alert('用户名或密码错误');currentUser=user;myName=u;document.getElementById('userDisplay').textContent='👤 '+u;document.getElementById('btnLoginTop').textContent='退出';document.getElementById('btnLoginTop').onclick=logout;document.getElementById('btnEnter').disabled=false;document.getElementById('btnEnter').classList.remove('btn-disabled');document.getElementById('loginTip').textContent='✅ 已登录：'+u;closeModal('authModal')}}

async function createRoom(mode){gameMode=mode||'classic';roomId=Math.floor(1000+Math.random()*9000).toString();isHost=true;myName=currentUser.username;document.getElementById('lobbyRoomDisp').textContent=roomId;document.getElementById('hostTag').textContent='(房主👑)';document.getElementById('startBtn').style.display='block';document.getElementById('modeTag').textContent=mode==='chess'?'♟️ 象棋模式':'🏆 经典模式';let setHTML=`<div class="setting-row"><span>🗺️ 活动半径</span><select id="rangeSelect"><option value="100">100米</option><option value="200">200米</option><option value="300" selected>300米</option><option value="400">400米</option><option value="500">500米</option></select></div>`;setHTML+=`<div class="setting-row"><span>🌐 全员实时定位</span><select id="globalTrackSelect"><option value="off">关闭</option><option value="on">20分钟后开启</option></select></div>`;if(mode==='chess'){setHTML+=`<div class="setting-row"><span>🎲 分配方式</span><select id="assignSelect" onchange="toggleAssignMode()"><option value="random">随机分配</option><option value="free">自由组队</option></select></div><div class="setting-row"><span>🔒 淘汰后身份</span><select id="chessReveal"><option value="reveal">公开</option><option value="hide">隐藏</option></select></div><div class="setting-row"><span>⚔️ 低撕高结果</span><select id="chessLowRule"><option value="kill">低等级淘汰</option><option value="freeze">高等级停留30秒</option></select></div><div id="freePanel" style="display:none;width:100%"></div>`}else{setHTML+=`<div class="setting-row"><span>👥 阵营</span><select id="classicTeamSelect" onchange="toggleTeamOpt()"><option value="none">无阵营</option><option value="teams">红蓝两队</option></select></div><div class="setting-row" id="assignRow" style="display:none"><span>🎲 分配方式</span><select id="assignSelect" onchange="toggleAssignMode()"><option value="random">随机分配</option><option value="free">自由组队</option></select></div><div id="freePanel" style="display:none;width:100%"></div>`}document.getElementById('lobbySettings').innerHTML=setHTML;showScreen('screenLobby');await sb.from('rooms').upsert({id:roomId,status:'waiting',host:myName,mode:gameMode,drop_item:null});await sb.from('players').upsert({room_id:roomId,name:myName,alive:true,hearts:1,team:null,chess_role:null},{onConflict:'room_id,name'});refreshLobby();lobbyTimer=setInterval(refreshLobby,2000)}
async function joinRoom(){myName=currentUser.username;roomId=document.getElementById('joinRoomInput').value.trim();if(!roomId||roomId.length!==4||isNaN(roomId))return alert('请输入4位房间号');const{data:room}=await sb.from('rooms').select('*').eq('id',roomId).single();if(!room)return alert('房间不存在');gameMode=room.mode||'classic';isHost=false;document.getElementById('lobbyRoomDisp').textContent=roomId;document.getElementById('startBtn').style.display='none';document.getElementById('modeTag').textContent=gameMode==='chess'?'♟️ 象棋模式':'🏆 经典模式';await sb.from('players').upsert({room_id:roomId,name:myName,alive:true,hearts:1,team:null,chess_role:null},{onConflict:'room_id,name'});refreshLobby();lobbyTimer=setInterval(refreshLobby,2000)}
async function refreshLobby(){const{data}=await sb.from('players').select('*').eq('room_id',roomId);if(!data)return;document.getElementById('lobbyCount').textContent=data.length;document.getElementById('lobbyPlayerTags').innerHTML=data.map(p=>`<span class="info-chip chip-blue" style="margin:3px">${p.name}${p.name===myName&&isHost?' 👑':''}${isHost&&p.name!==myName?` <span style="color:#ff5252;cursor:pointer;margin-left:4px" onclick="kickPlayer('${p.name}')">✕</span>`:''}</span>`).join('');const sel=document.getElementById('assignSelect');if(isHost&&sel&&sel.value==='free')renderFreePanel(data);const{data:room}=await sb.from('rooms').select('*').eq('id',roomId).single();if(room&&room.status==='playing'){clearInterval(lobbyTimer);await loadPlayers();startGameScreen()}}
function renderFreePanel(data){const p=document.getElementById('freePanel');const r=data.filter(x=>x.team==='red'),b=data.filter(x=>x.team==='blue'),u=data.filter(x=>!x.team);p.style.display='block';p.innerHTML=`<div class="team-panel"><div class="team-box red"><h3>🔴 红队 (${r.length})</h3>${r.map(x=>`<span class="member">${x.name}${isHost&&x.name!==myName?` <span class="kick-btn" onclick="kickPlayer('${x.name}')">✕</span>`:''}</span>`).join('')}</div><div class="team-box blue"><h3>🔵 蓝队 (${b.length})</h3>${b.map(x=>`<span class="member">${x.name}${isHost&&x.name!==myName?` <span class="kick-btn" onclick="kickPlayer('${x.name}')">✕</span>`:''}</span>`).join('')}</div></div><div class="unassigned">未选择：${u.map(x=>`<span onclick="pickTeam('${x.name}','red')">🔴</span><span onclick="pickTeam('${x.name}','blue')">🔵</span> ${x.name}</span>`).join(' ')}</div>`}

async function startGame(){RANGE_R=parseInt(document.getElementById('rangeSelect')?.value||300);globalTrackEnabled=document.getElementById('globalTrackSelect')?.value==='on';globalTrackActive=false;reboundDropCount=0;gameTime=0;killStats={};reboundUser=null;clearInterval(reboundTimer);const assignEl=document.getElementById('assignSelect');const assignMode=assignEl?assignEl.value:'random';const teamEl=document.getElementById('classicTeamSelect');if(assignMode==='random'&&((teamEl&&teamEl.value==='teams')||gameMode==='chess')){const{data}=await sb.from('players').select('*').eq('room_id',roomId);if(data)for(let i=0;i<data.length;i++){await sb.from('players').update({team:i%2===0?'red':'blue'}).eq('room_id',roomId).eq('name',data[i].name);killStats[data[i].name]=0}}if(gameMode==='chess'){const{data}=await sb.from('players').select('*').eq('room_id',roomId);if(data){const reds=data.filter(p=>p.team==='red'),blues=data.filter(p=>p.team==='blue');const redRoles=['帅','相','车','炮','兵'],blueRoles=['将','象','车','炮','卒'];const shRed=[...redRoles].sort(()=>Math.random()-.5);const shBlue=[...blueRoles].sort(()=>Math.random()-.5);for(let i=0;i<reds.length;i++){const role=(i<5)?shRed[i]:shRed[Math.floor(Math.random()*4+1)];await sb.from('players').update({chess_role:role}).eq('room_id',roomId).eq('name',reds[i].name)}for(let i=0;i<blues.length;i++){const role=(i<5)?shBlue[i]:shBlue[Math.floor(Math.random()*4+1)];await sb.from('players').update({chess_role:role}).eq('room_id',roomId).eq('name',blues[i].name)}}}if(Object.keys(killStats).length===0){const{data}=await sb.from('players').select('name').eq('room_id',roomId);if(data)data.forEach(p=>{killStats[p.name]=0})}await sb.from('rooms').update({status:'playing',range_r:RANGE_R,center_lat:CENTER.lat,center_lng:CENTER.lng,global_track:globalTrackEnabled}).eq('id',roomId);clearInterval(lobbyTimer);if(typeof loadPlayers==='function')await loadPlayers();startGameScreen()}
async function startGameScreen(){showScreen('screenGame');document.getElementById('gameRoomDisp').textContent=roomId;document.getElementById('gameModeTitle').textContent=gameMode==='chess'?'象棋模式':'经典模式';myItems=[];gameLog=[];const{data:room}=await sb.from('rooms').select('center_lat,center_lng,range_r,global_track').eq('id',roomId).single();if(room&&room.center_lat){CENTER={lat:room.center_lat,lng:room.center_lng};RANGE_R=room.range_r;globalTrackEnabled=room.global_track||false}addLog('🎮 游戏开始！');speakAll('游戏开始！');sfx('start');initGameMap();currentDrop=null;startDropTimer();startPolling();renderAll()}

function initGameMap(){if(typeof AMap==='undefined'){setTimeout(initGameMap,500);return}const initCenter=(userPos&&userPos.lat!==39.909)?[userPos.lng,userPos.lat]:[CENTER.lng,CENTER.lat];gameMap=new AMap.Map('gameMapFull',{zoom:17,center:initCenter});rangeCircle=new AMap.Circle({center:initCenter,radius:RANGE_R,fillOpacity:.06,strokeColor:'#00c8ff',strokeWeight:3,strokeDasharray:[8,5]});rangeCircle.setMap(gameMap);userMarker=new AMap.Marker({position:initCenter,content:'<div style="background:#0984e3;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px">⚡ 我</div>',offset:new AMap.Pixel(-15,-15),zIndex:999});userMarker.setMap(gameMap);getUserPosGame()}
function getUserPosGame(){AMap.plugin('AMap.Geolocation',function(){var geo=new AMap.Geolocation({enableHighAccuracy:true,timeout:10000});geo.watchPosition();geo.on('complete',function(p){userPos={lat:p.position.lat,lng:p.position.lng};if(gameMap&&userMarker)userMarker.setPosition([userPos.lng,userPos.lat]);checkDropDist()})})}
function dist(a,b){const R=6371000;const dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))}

function getDropPool(){if(globalTrackActive)return itemPoolNoTrack.filter(i=>i.type!=='rebound'||reboundDropCount<2);return itemPool.filter(i=>i.type!=='rebound'||reboundDropCount<2)}
async function spawnDropItem(){const pool=getDropPool();if(pool.length===0)return;const item=pool[Math.floor(Math.random()*pool.length)],rlat=CENTER.lat+(Math.random()-.5)*.003,rlng=CENTER.lng+(Math.random()-.5)*.003;currentDrop={name:item.name,icon:item.icon,type:item.type,lat:rlat,lng:rlng};if(item.type==='rebound')reboundDropCount++;await sb.from('rooms').update({drop_item:JSON.stringify(currentDrop)}).eq('id',roomId);showDropOnMap();speakAll('道具已刷新！');sfx('drop')}
function showDropOnMap(){if(!currentDrop)return;document.getElementById('dropCard').classList.add('show');document.getElementById('dropIcon').textContent=currentDrop.icon;document.getElementById('dropName').textContent=currentDrop.name;if(dropMarker&&gameMap)dropMarker.setMap(null);if(gameMap){dropMarker=new AMap.Marker({position:[currentDrop.lng,currentDrop.lat],content:'<div style="background:#ffd100;color:#333;padding:4px 10px;border-radius:14px;font-size:12px">'+currentDrop.icon+'</div>',offset:new AMap.Pixel(-15,-15)});dropMarker.setMap(gameMap)}}
async function checkRoomDrop(){const{data:room}=await sb.from('rooms').select('drop_item').eq('id',roomId).single();if(room&&room.drop_item){try{const item=JSON.parse(room.drop_item);if(item&&item.name&&(!currentDrop||currentDrop.name!==item.name)){currentDrop=item;showDropOnMap()}}catch(e){}}}
function checkDropDist(){if(!currentDrop||!userPos)return;const d=dist(userPos,currentDrop);if(d<=10){document.getElementById('dropCard').classList.add('show');document.getElementById('dropDist').textContent='📏 '+d+' 米 ✅'}else{document.getElementById('dropDist').textContent='📏 '+d+' 米'}}
async function pickupItem(){if(!currentDrop)return;const d=userPos?dist(userPos,currentDrop):999;if(d>10)return alert('❌ 距离太远！');myItems.push({name:currentDrop.name,icon:currentDrop.icon,type:currentDrop.type});addLog('🎁 '+myName+' 拾取了 '+currentDrop.name);speakAll(myName+'拾取了'+currentDrop.name);sfx('pickup');currentDrop=null;document.getElementById('dropCard').classList.remove('show');if(dropMarker){dropMarker.setMap(null);dropMarker=null}await sb.from('rooms').update({drop_item:null}).eq('id',roomId);saveItems();renderAll()}
function startDropTimer(){if(dropTimer)return;dropSec=480;updateDropDisplay();dropTimer=setInterval(async()=>{dropSec--;updateDropDisplay();if(dropSec<=0){await spawnDropItem();dropSec=480}},1000)}
function updateDropDisplay(){const m=Math.floor(dropSec/60),s=dropSec%60;document.getElementById('dropCountdown').textContent=m+':'+String(s).padStart(2,'0')}

let currentPanel=null;
function togglePanel(name){const panels={players:'panelPlayers',bag:'panelBag',log:'panelLog'};const btns={players:'bottomPlayers',bag:'bottomBag',log:'bottomLog',map:'bottomMap'};if(currentPanel===name){document.getElementById(panels[name]).style.display='none';currentPanel=null;document.getElementById('bottomMap').className='btn btn-sm btn-primary';document.getElementById('bottomMap').style.flex='1';return}if(currentPanel)document.getElementById(panels[currentPanel]).style.display='none';document.getElementById(panels[name]).style.display='block';currentPanel=name;['bottomMap','bottomPlayers','bottomBag','bottomLog'].forEach(b=>{document.getElementById(b).className='btn btn-sm btn-secondary';document.getElementById(b).style.flex='1'});document.getElementById(btns[name]).className='btn btn-sm btn-primary';document.getElementById(btns[name]).style.flex='1'}

let globalTrackMarkers=[];
function showAllPlayersOnMap(){if(!gameMap)return;globalTrackMarkers.forEach(m=>m.setMap(null));globalTrackMarkers=[];players.filter(p=>p.alive).forEach(p=>{const pos=p.lat&&p.lng?[p.lng,p.lat]:null;if(!pos)return;const m=new AMap.Marker({position:pos,content:`<div style="background:${p.team==='red'?'#ff5252':'#00c8ff'};color:#fff;padding:2px 8px;border-radius:10px;font-size:10px">${p.name}</div>`,offset:new AMap.Pixel(-15,-15),zIndex:100});m.setMap(gameMap);globalTrackMarkers.push(m)})}

async function loadPlayers(){const{data}=await sb.from('players').select('*').eq('room_id',roomId);if(data)players=data.map(p=>({id:p.id,name:p.name,alive:p.alive,waitingKill:p.waiting_kill,hearts:p.hearts||1,team:p.team,chess_role:p.chess_role}));const me=players.find(p=>p.name===myName);if(me&&me.waitingKill&&!document.getElementById('confirmModal').classList.contains('show')){if(gameMode==='chess'){handleChessKill(me.waitingKill,myName)}else{document.getElementById('confirmKiller').textContent=me.waitingKill;showModal('confirmModal');speakLocal('你被'+me.waitingKill+'撕了！');sfx('kill')}}}
function startPolling(){pollTimer=setInterval(async()=>{gameTime+=2;await loadPlayers();checkRoomDrop();renderAll();checkEnd();if(globalTrackEnabled&&gameTime>=1200&&!globalTrackActive){globalTrackActive=true;document.getElementById('globalTrackBar').style.display='inline-block';addLog('🌐 全员实时定位已开启！');speakAll('全员定位已开启！')}if(globalTrackActive){const{data}=await sb.from('players').select('name,lat,lng,alive,team').eq('room_id',roomId);if(data){sb.from('players').update({lat:userPos?.lat||null,lng:userPos?.lng||null}).eq('room_id',roomId).eq('name',myName);players=data.map(p=>({...p,hearts:players.find(x=>x.name===p.name)?.hearts||1}));showAllPlayersOnMap()}}},2000)}
function checkEnd(){const alv=players.filter(p=>p.alive);if(alv.length<=1&&players.length>0){const w=alv[0]?.name||'无人';addLog('🏆 游戏结束！获胜者：'+w);speakAll('游戏结束！获胜者是'+w);sfx('win');clearInterval(pollTimer);clearInterval(dropTimer);showWinScreen(w)}}
function showWinScreen(winner){document.getElementById('winName').textContent=winner;const stats=Object.entries(killStats).sort((a,b)=>b[1]-a[1]).map(([n,k])=>`${n}: ${k}击杀`).join('<br>');document.getElementById('winStats').innerHTML='<br>📊 击杀榜<br>'+stats+'<br><br>⏱️ 游戏时长：'+Math.floor(gameTime/60)+'分钟';document.getElementById('winOverlay').classList.add('show');for(let i=0;i<50;i++){setTimeout(()=>{const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#00c8ff','#ffd100','#00e676','#ff5252','#c864ff'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000)},i*50)}}

async function handleChessKill(attacker,target){const a=players.find(p=>p.name===attacker),t=players.find(p=>p.name===target);if(!a||!t)return;const al=CHESS_LEVEL[a.chess_role]||0,tl=CHESS_LEVEL[t.chess_role]||0;let r='';if(a.chess_role==='兵'||a.chess_role==='卒'){if(t.chess_role==='帅'||t.chess_role==='将')r='kill_target'}else if(al>tl)r='kill_target';else if(al<tl){r=document.getElementById('chessLowRule')?.value==='freeze'?'freeze':'kill_attacker'}else r='both';if(r==='kill_target'){t.alive=false;t.hearts=0;await sb.from('players').update({alive:false,hearts:0,waiting_kill:null}).eq('room_id',roomId).eq('name',target);addLog('💀 '+attacker+' 淘汰 '+target);speakAll(attacker+'淘汰了'+target);sfx('kill');vibrate();killStats[attacker]=(killStats[attacker]||0)+1}else if(r==='kill_attacker'){a.alive=false;a.hearts=0;await sb.from('players').update({alive:false,hearts:0,waiting_kill:null}).eq('room_id',roomId).eq('name',attacker);addLog('💀 '+attacker+' 逆撕失败');speakAll(attacker+'逆撕失败！');sfx('kill');vibrate()}else if(r==='both'){a.alive=false;a.hearts=0;t.alive=false;t.hearts=0;await sb.from('players').update({alive:false,hearts:0}).eq('room_id',roomId).eq('name',attacker);await sb.from('players').update({alive:false,hearts:0}).eq('room_id',roomId).eq('name',target);addLog('💀 同归于尽');speakAll('同归于尽！');sfx('kill');vibrate()}else if(r==='freeze'){addLog('❄️ '+target+' 被冻结30秒');speakAll(target+'被冻结30秒')}renderAll();checkEnd()}

// ============ 淘汰 ============
function clickP(name){if(name===myName)return;const me=players.find(p=>p.name===myName);if(!me||!me.alive)return;const p=players.find(p=>p.name===name);if(!p||!p.alive||p.waitingKill)return;if(me.team&&p.team&&me.team===p.team)return alert('不能撕队友！');if(gameMode==='chess'){handleChessKill(myName,name);return}killTarget=name;document.getElementById('killName').textContent=name;showModal('killModal')}
async function doKill(){if(!killTarget)return;const p=players.find(p=>p.name===killTarget);if(!p)return;if(p.hearts>1){p.hearts--;await sb.from('players').update({hearts:p.hearts}).eq('room_id',roomId).eq('name',killTarget);addLog('💚 '+killTarget+' 消耗一心剩'+p.hearts);speakAll(killTarget+'失去一颗心！')}else if(reboundUser===killTarget&&reboundTimer){const attacker=myName;addLog('🛡️ '+killTarget+' 反弹了 '+attacker);speakAll(killTarget+'反弹了'+attacker);sfx('kill');clearRebound();const me2=players.find(x=>x.name===attacker);if(me2){me2.hearts--;if(me2.hearts<=0){me2.alive=false;await sb.from('players').update({alive:false,hearts:0}).eq('room_id',roomId).eq('name',attacker);speakAll(attacker+'被反弹淘汰！')}}}else{p.waitingKill=myName;await sb.from('players').update({waiting_kill:myName}).eq('room_id',roomId).eq('name',killTarget);addLog('⚡ '+myName+' 发起淘汰 '+killTarget)}closeModal('killModal');killTarget='';await loadPlayers();renderAll()}
async function confirmKilled(){const me=players.find(p=>p.name===myName);if(!me||!me.waitingKill)return;const kn=me.waitingKill;me.alive=false;me.waitingKill=null;await sb.from('players').update({alive:false,waiting_kill:null}).eq('room_id',roomId).eq('name',myName);addLog('💀 '+kn+' 淘汰了 '+myName);speakAll(kn+'淘汰了'+myName);sfx('kill');vibrate();killStats[kn]=(killStats[kn]||0)+1;closeModal('confirmModal');checkRevive();const rwd=itemPool[Math.floor(Math.random()*6)];myItems.push(rwd);addLog('🏆 奖励：'+rwd.name);saveItems();await loadPlayers();renderAll();checkEnd()}
async function denyKill(){const me=players.find(p=>p.name===myName);if(!me||!me.waitingKill)return;me.waitingKill=null;await sb.from('players').update({waiting_kill:null}).eq('room_id',roomId).eq('name',myName);addLog('🤚 '+myName+' 否认被撕');closeModal('confirmModal');await loadPlayers();renderAll()}

function clearRebound(){clearInterval(reboundTimer);reboundTimer=null;reboundUser=null;reboundSec=300}
function startRebound(user){clearRebound();reboundUser=user;reboundSec=300;reboundTimer=setInterval(()=>{reboundSec--;if(reboundSec<=0){speakAll(user+'的反弹卡已失效');addLog('🛡️ '+user+' 的反弹卡失效');clearRebound();renderAll()}},1000)}

function checkRevive(){const me=players.find(p=>p.name===myName);if(!me||me.alive)return;const idx=myItems.findIndex(i=>i.type==='revive');if(idx===-1)return;reviveSec=180;document.getElementById('reviveBar').style.display='block';updateReviveCountdown();reviveTimer=setInterval(()=>{reviveSec--;updateReviveCountdown();if(reviveSec<=0)declineRevive()},1000)}
function updateReviveCountdown(){document.getElementById('reviveCountdown').textContent=Math.floor(reviveSec/60)+':'+String(reviveSec%60).padStart(2,'0')}
function useReviveSelf(){const idx=myItems.findIndex(i=>i.type==='revive');if(idx===-1)return;const me=players.find(p=>p.name===myName);if(!me)return;me.alive=true;me.hearts=1;sb.from('players').update({alive:true,hearts:1}).eq('room_id',roomId).eq('name',myName);myItems.splice(idx,1);saveItems();clearReviveBar();addLog('🔄 '+myName+' 复活了自己');speakAll(myName+'复活了！');sfx('revive');loadPlayers();renderAll()}
function showReviveTeammate(){showModal('reviveModal');const d=players.filter(p=>!p.alive&&p.name!==myName);document.getElementById('reviveTargets').innerHTML=d.length?d.map(p=>`<button class="btn btn-sm btn-primary" onclick="reviveTeammate('${p.name}')" style="margin:3px">🔄 ${p.name}</button>`).join(''):'<p style="color:#7eaabf">无淘汰队友</p>'}
async function reviveTeammate(name){const idx=myItems.findIndex(i=>i.type==='revive');if(idx===-1)return;await sb.from('players').update({alive:true,hearts:1}).eq('room_id',roomId).eq('name',name);myItems.splice(idx,1);saveItems();closeModal('reviveModal');clearReviveBar();addLog('🔄 '+myName+' 复活了 '+name);speakAll(name+'复活了！');sfx('revive');loadPlayers();renderAll()}
function declineRevive(){clearReviveBar()}function clearReviveBar(){clearInterval(reviveTimer);document.getElementById('reviveBar').style.display='none'}

// ============ 道具使用（全部带播报+音效） ============
function useItem(idx){const item=myItems[idx];if(item.type==='track'){const tg=players.filter(p=>p.alive&&p.name!==myName);if(!tg.length)return alert('无目标');document.getElementById('useTitle').textContent='📍 定位卡';document.getElementById('useBody').innerHTML=tg.map(p=>`<button class="btn btn-sm btn-primary" onclick="doTrack('${p.name}',${idx})" style="margin:3px">📍 ${p.name}</button>`).join('');showModal('useModal')}else if(item.type==='revive'){const tg=players.filter(p=>!p.alive);if(!tg.length)return alert('无人可复活');document.getElementById('useTitle').textContent='🔄 复活卡';document.getElementById('useBody').innerHTML=tg.map(p=>`<button class="btn btn-sm btn-primary" onclick="doRevive('${p.name}',${idx})" style="margin:3px">🔄 ${p.name}</button>`).join('');showModal('useModal')}else if(item.type==='radar'){const alv=players.filter(p=>p.alive);document.getElementById('useTitle').textContent='🔮 雷达卡';document.getElementById('useBody').innerHTML='<p style="color:#00e676">📡 存活：'+alv.map(p=>p.name).join('、')+'</p>';showModal('useModal');myItems.splice(idx,1);saveItems();addLog('🔮 '+myName+' 使用了雷达卡');speakAll(myName+'使用了雷达卡');sfx('pickup');setTimeout(()=>{closeModal('useModal');renderAll()},2000)}else if(item.type==='scout'){const tg=players.filter(p=>p.name!==myName);if(!tg.length)return alert('无目标');document.getElementById('useTitle').textContent='🔎 侦查卡';document.getElementById('useBody').innerHTML=tg.map(p=>`<button class="btn btn-sm btn-primary" onclick="doScout('${p.name}',${idx})" style="margin:3px">🔎 ${p.name}</button>`).join('');showModal('useModal')}else if(item.type==='double'){const me=players.find(p=>p.name===myName);if(!me)return;me.hearts=(me.hearts||1)+1;sb.from('players').update({hearts:me.hearts}).eq('room_id',roomId).eq('name',myName);myItems.splice(idx,1);saveItems();addLog('💚 '+myName+' 使用了双命卡');speakAll(myName+'生命+1');sfx('pickup');renderAll()}else if(item.type==='rebound'){myItems.splice(idx,1);saveItems();startRebound(myName);addLog('🛡️ '+myName+' 使用了反弹卡（5分钟）');speakAll(myName+'使用了反弹卡');sfx('pickup');renderAll()}}
async function doTrack(name,idx){addLog('📍 '+myName+' 定位了 '+name);speakAll(myName+'定位了'+name);sfx('pickup');myItems.splice(idx,1);saveItems();closeModal('useModal');renderAll()}
async function doRevive(name,idx){await sb.from('players').update({alive:true,hearts:1}).eq('room_id',roomId).eq('name',name);addLog('🔄 '+myName+' 复活了 '+name);speakAll(myName+'复活了'+name);sfx('revive');myItems.splice(idx,1);saveItems();closeModal('useModal');loadPlayers();renderAll()}
async function doScout(name,idx){const p=players.find(p=>p.name===name);if(!p)return;const info=gameMode==='chess'?'身份：'+(p.chess_role||'未知'):'队伍：'+(p.team||'无');addLog('🔎 '+myName+' 侦查了 '+name+' - '+info);speakAll(myName+'侦查了'+name);sfx('pickup');alert('🔎 '+name+'：'+info);myItems.splice(idx,1);saveItems();closeModal('useModal');renderAll()}

function renderAll(){
    const me=players.find(p=>p.name===myName);
    const alv=players.filter(p=>p.alive),ded=players.filter(p=>!p.alive),wait=players.filter(p=>p.waitingKill);
    document.getElementById('aliveNum').textContent=alv.length;document.getElementById('waitNum').textContent=wait.length;document.getElementById('deadNum').textContent=ded.length;
    document.getElementById('playerList').innerHTML=players.map(p=>{let cls='live';if(!p.alive)cls='dead';if(p.waitingKill)cls='wait';return `<div class="player-row ${cls}" onclick="${p.alive&&!p.waitingKill&&p.name!==myName?"clickP('"+p.name+"')":''}"><span><span class="status-dot ${!p.alive?'dot-dead':p.waitingKill?'dot-wait':'dot-alive'}"></span>${p.name}${p.name===myName?' (你)':''}${gameMode==='chess'&&p.chess_role&&(p.name===myName||p.team===me.team)?' ['+p.chess_role+']':''}${p.team?(' '+(p.team==='red'?'🔴':'🔵')):''}${reboundUser===p.name?' 🛡️':''}</span><span class="hearts">${'❤️'.repeat(p.hearts||0)||'🖤'}</span></div>`}).join('');
    document.getElementById('bagArea').innerHTML=myItems.length?myItems.map((it,i)=>`<button class="btn btn-sm btn-primary" style="margin:3px" onclick="useItem(${i})">${it.icon} ${it.name}</button>`).join(' '):'<span style="color:#7eaabf">空空如也</span>';
    document.getElementById('logArea').innerHTML=gameLog.slice(-15).reverse().map(l=>`<div style="padding:2px 0;border-bottom:1px solid rgba(0,200,255,.1)"><span style="color:#4a7a9a;font-size:10px">${l.time}</span> ${l.msg}</div>`).join('');
}
async function saveItems(){await sb.from('players').update({items:JSON.stringify(myItems)}).eq('room_id',roomId).eq('name',myName)}

document.getElementById('btnLoginTop').addEventListener('click',()=>showModal('authModal'));
document.getElementById('btnAuth').addEventListener('click',handleAuth);
document.getElementById('btnEnter').addEventListener('click',()=>showModal('mainMenuModal'));
document.getElementById('btnKill').addEventListener('click',doKill);
document.getElementById('btnConfirm').addEventListener('click',confirmKilled);
document.getElementById('btnDeny').addEventListener('click',denyKill);

(function(){const layer=document.getElementById('particlesContainer');const cls=['rgba(0,200,255,.6)','rgba(255,209,0,.5)','rgba(0,230,118,.5)','rgba(180,100,255,.5)'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='dp';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.background=cls[Math.floor(Math.random()*cls.length)];d.style.setProperty('--dd',(6+Math.random()*8)+'s');d.style.setProperty('--dx1',(Math.random()-.5)*40+'px');d.style.setProperty('--dy1',(Math.random()-.5)*40+'px');d.style.setProperty('--dx2',(Math.random()-.5)*50+'px');d.style.setProperty('--dy2',(Math.random()-.5)*50+'px');d.style.setProperty('--dx3',(Math.random()-.5)*30+'px');d.style.setProperty('--dy3',(Math.random()-.5)*30+'px');d.style.animationDelay=Math.random()*6+'s';layer.appendChild(d)}})();

document.addEventListener('click',function(e){if(e.target.closest('.panel')||e.target.closest('.btn')||e.target.closest('.stat')||e.target.closest('.tag')){const syms=['0','1','[',']','{','}','<','>','/','|','#','*','◇','◆','○'];const cls=['#00c8ff','#ffd100','#00e676','#ff5252','#c864ff'];for(let i=0;i<10;i++){const el=document.createElement('span');el.className='fragment';el.textContent=syms[Math.floor(Math.random()*syms.length)];el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';el.style.color=cls[Math.floor(Math.random()*cls.length)];el.style.fontSize=(6+Math.random()*5)+'px';el.style.setProperty('--dx',(Math.random()-.5)*80+'px');el.style.setProperty('--dy',(Math.random()-.5)*80+'px');el.style.setProperty('--rot',(Math.random()-.5)*360+'deg');el.style.animationDuration=(.5+Math.random()*.4)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),800)}}});

const s=document.createElement('script');s.src='https://webapi.amap.com/maps?v=2.0&key='+AMAP_KEY;document.head.appendChild(s);
</script>
